# Personal Feed configuration. Secrets (API keys, tokens) never go here; they come from
# environment variables / GitHub repository secrets. See README.md.

[digest]
# false = plain list of every new article (original headlines + feed snippets, no API cost).
# true  = an AI model writes the brief from the top-ranked stories (see [ai] below).
summarize = false
# Your timezone; decides which date the brief is labelled with.
timezone = "America/New_York"
# How far back the daily brief looks.
window_hours = 26
# How many ranked story clusters are sent to the AI model. More = better coverage, higher cost.
max_clusters_for_llm = 160
# Sections the brief is split into, in display order. Stories labelled DEAL go in "Deals".
sections = ["AI", "Tech", "Gaming", "US", "World", "Europe", "Japan", "Korea", "Deals"]
# Headlines matching any of these (case-insensitive substrings) are dropped before ranking.
# Deals aren't muted; they're labelled DEAL and collected in their own section instead.
mute = [
  "how to ", "review:", "sponsored", "giveaway", "wordle", "connections hint",
  "contexto", "best gaming", "gift guide",
]
# Same, as regular expressions (case-insensitive, Python syntax) for filler that needs whole words
# or a shape: "codes" alone would also hide a story about stolen 2FA codes. Keep them anchored.
mute_patterns = [
  # Daily puzzles: "NYT Strands Hints and Answers for Game #945", "Slate Mini Crossword for Oct. 4"
  '\b(?:wordle|quordle|octordle|spangram|crosswords?)\b',
  '\b(?:hints?|answers?|clues?)\b.{0,40}\b(?:game|puzzle) #\d+',
  # Puzzle names are ordinary words ("pinpoint clues", "connections"), so they need a puzzle cue.
  '\b(?:nyt |linkedin )?(?:connections|strands|contexto|pinpoint|spelling bee)\b.{0,30}\bhints?\b.{0,30}\b(?:answers?|today|#\d+)',
  '\b(?:nyt|linkedin) (?:connections|strands|pinpoint|spelling bee)\b',
  # Game-code and promo-code pages: "Roblox Music Codes", "Mech Arena Codes and Free Rewards"
  '\b(?:promo|coupon|redeem|redemption) codes?\b',
  '\bcodes?\b.{0,12}\b(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{4}\b',
  '\bcodes? (?:&|and) (?:free )?rewards\b',
  '^all .{1,40}\bcodes\b',
  '\broblox\b.{0,40}\bcodes\b',
  # Recurring features: "Today in Korean history", "Latest news bulletin | October 5th"
  '^(?:today in .{0,30}history|top headlines in|latest news bulletin|daily cartoon)\b',
  'sponsors-only newsletter',
]

[digest.section_limits]
# Plain-list mode (no AI) lists every story; the regional sections have hundreds, so keep the
# top N of each. Sections not listed here are unlimited.
US = 12
World = 12
Europe = 12
Japan = 8
Korea = 8

[translate]
# Feeds marked pfLang="xx" in feeds.opml are machine-translated to English at ingest with Gemini
# (needs GEMINI_API_KEY; the free tier is enough). Each headline is translated once and cached.
# Without a key, or if a call fails, those items are left out until a later run translates them.
enabled = true
batch_size = 40
max_calls_per_run = 3
# The ingest runs every 10 minutes: wait until this many headlines need translating (fewer calls),
# unless the oldest of them has waited this many minutes.
min_batch = 10
max_wait_minutes = 20
# Models for translation, tried in order (instead of [gemini] below). Flash-Lite translates
# headlines well and has the larger free daily allowance, leaving Flash for summaries.
models = ["gemini-3.5-flash-lite", "gemini-3.7-flash"]

[story_summaries]
# The top stories in the app's shared feed get a 1-2 sentence AI summary (Gemini) written from
# their outlets' headlines and feed snippets, instead of just the first outlet's snippet. Each
# story is summarized once, and again when its coverage grows a lot (at most
# max_refresh_per_run per run). Needs GEMINI_API_KEY; without it stories keep their snippet.
enabled = true
top_n = 40
# Wait until this many top stories need a summary before calling Gemini (fewer calls); a story
# in the top 10 is summarized right away.
min_new = 4
batch_size = 20
max_calls_per_run = 2
max_refresh_per_run = 5
# Optional: models = [...] to use other models than [gemini] below, like [translate] does.

[ai]
# Which model writes the brief when summarize = true. Override with the AI_PROVIDER env var.
#   "gemini" = Google AI Studio free tier (needs GEMINI_API_KEY)
#   "claude" = Anthropic API, paid (needs ANTHROPIC_API_KEY)
provider = "gemini"

[gemini]
# Override with the GEMINI_MODEL env var. Check aistudio.google.com for current free-tier models.
model = "gemini-3.8-flash"
# Tried in order when the model above is still overloaded (HTTP 5xx) after its retries, or out
# of quota (HTTP 429, not retried). A model that failed is skipped for 2 minutes within a run
# and for 30 minutes by later ingest runs; the daily brief always tries the model above first.
fallback_models = ["gemini-3.7-flash", "gemini-3.5-flash-lite"]

[claude]
# Override with the CLAUDE_MODEL env var. claude-sonnet-5-5 or claude-haiku-4-5 cost less.
model = "claude-opus-5-5"
# low | medium | high (ignored on Haiku). Summarizing headlines doesn't need much depth.
effort = "medium"
max_tokens = 32000

[ranking]
# Points added per distinct outlet covering the story (the strongest signal).
per_source = 3.0
official_boost = 2.5
techmeme_boost = 3.0
# Hacker News: log-scaled bonus from the "Points:" value hnrss puts in each item.
hn_points_weight = 1.5
# Stories lose this many points per hour of age.
age_penalty_per_hour = 0.08
# Multiplies the outlet-count score for a category. US, World and Europe have far more sources
# than AI/Tech/Gaming and every outlet covers the same big story, so without this one political
# or world story would take every top slot.
[ranking.category_weight]
US = 0.3
World = 0.5
Europe = 0.5

# Case-insensitive substrings that make a story more important to *you*.
[ranking.boosts]
"claude" = 3.0
"anthropic" = 3.0
"openai" = 1.5
"gpt-" = 1.5
"gemini" = 1.0
"swiftui" = 2.0
"xcode" = 1.5
"ios 2" = 1.5
"apple intelligence" = 1.0
"nintendo direct" = 3.0
"state of play" = 2.5
"switch 2" = 1.5
"xbox showcase" = 2.5
"gta 6" = 2.5
"gta vi" = 2.5

[alerts]
# Hard cap on push alerts per (UTC) day, so this never turns back into a doomscroll.
max_per_day = 5
# Only items published within this many minutes are considered for alerts. When the previous
# run was longer ago, the lookback covers the gap since then (up to 4 hours).
lookback_minutes = 90
# A watchlist story needs at least this many distinct outlets (an official source counts as 2).
min_sources = 2

# Watchlist rules. `match` is a list of term groups: a headline matches when it contains at
# least one term from EVERY group. Terms are case-insensitive substrings.
[[alerts.watch]]
name = "OpenAI model launch"
match = [["gpt-", "openai o"], ["launch", "release", "available", "introduc", "announce", "unveil"]]

[[alerts.watch]]
name = "New Claude model"
match = [["claude"], ["opus", "sonnet", "haiku", "fable", "new model", "launch", "release"]]

[[alerts.watch]]
name = "Gemini launch"
match = [["gemini"], ["launch", "release", "available", "introduc", "announce", "unveil"]]

[[alerts.watch]]
name = "Nintendo Direct"
match = [["nintendo direct"]]

[[alerts.watch]]
name = "PlayStation State of Play"
match = [["state of play"]]

[[alerts.watch]]
name = "Xbox showcase"
match = [["xbox"], ["showcase", "direct"]]

[[alerts.watch]]
name = "Console price change"
match = [["switch", "playstation", "ps5", "xbox", "steam deck"], ["price increase", "price hike", "price cut", "raising the price", "raises price", "new price"]]

[[alerts.watch]]
name = "Apple event"
match = [["apple"], ["event", "keynote", "wwdc"]]

[health]
# Feeds with no new items for this many days are flagged in the brief and marked "stale" in the
# app's source list (journalists' Bluesky accounts can be quiet for 10+ days).
stale_days = 14
