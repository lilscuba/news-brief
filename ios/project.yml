# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen && open PersonalFeed.xcodeproj
#
# Before building, set these three to your own values (see server/README.md):
#   PRODUCT_BUNDLE_IDENTIFIER  must equal APPLE_BUNDLE_IDS in server/wrangler.toml and APNS_TOPIC
#   DEVELOPMENT_TEAM           your Apple Developer team id
#   API_BASE_URL               your deployed Worker, e.g. https://newsfeed-api.you.workers.dev/
name: PersonalFeed
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "D5W355MT7L"
targets:
  PersonalFeed:
    type: application
    platform: iOS
    sources: [PersonalFeed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lilscuba.brief
        # Xcode registers the app id, Sign in with Apple and Push with Apple automatically.
        CODE_SIGN_STYLE: Automatic
        API_BASE_URL: "https://newsfeed-api.snowy-fire-40b4.workers.dev/"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: PersonalFeed/PersonalFeed.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Xcode switches this to "production" when you archive for TestFlight / the App Store.
        aps-environment: development
    info:
      path: PersonalFeed/Info.plist
      properties:
        CFBundleDisplayName: Brief
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  PersonalFeedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PersonalFeedTests]
    dependencies:
      - target: PersonalFeed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
