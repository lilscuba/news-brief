name: Breaking alerts

on:
  schedule:
    # Every 15 minutes. GitHub often delays these; the 90-minute lookback covers the gap.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breaking-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Alert state (seen items, cooldowns, daily count) lives in the Actions cache instead of
      # being committed, so the repo doesn't get ~96 commits a day.
      - uses: actions/cache/restore@v4
        with:
          path: state/alerts.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Check for breaking news
        run: python -m briefing alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state/alerts.json
          key: alerts-state-${{ github.run_id }}
