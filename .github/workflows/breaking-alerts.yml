name: Breaking alerts

# The same check also runs as the `alerts` job of ingest.yml, which the Worker cron dispatches every
# 10 minutes (and GitHub schedules twice an hour as a backstop). This workflow is a further backstop
# and the way to run the check alone by hand.

on:
  schedule:
    # Every 2 hours at an odd minute (GitHub delays or drops schedules on busy minutes). It can
    # still run hours late, so don't rely on it alone for timely alerts.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breaking-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Alert state (seen items, cooldowns, daily count) lives in the Actions cache instead of
      # being committed, so the repo doesn't get a commit every few minutes. ingest.yml's
      # `alerts` job uses the same cache keys and concurrency group.
      - uses: actions/cache/restore@v4
        with:
          path: state/alerts.json
          key: alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alerts-state-

      - name: Check for breaking news
        run: python -m briefing alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state/alerts.json
          key: alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
